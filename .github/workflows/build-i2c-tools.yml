name: Build i2c-tools for Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK r21e manually
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r21e" >> $GITHUB_ENV
          echo "$HOME/android-ndk-r21e" >> $GITHUB_PATH

      - name: Build i2c-tools
        run: |
          wget -q https://mirrors.edge.kernel.org/pub/software/utils/i2c-tools/i2c-tools-4.3.tar.gz
          tar -xzf i2c-tools-4.3.tar.gz
          cd i2c-tools-4.3
          
          # 使用 NDK 工具链进行交叉编译
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang
          export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-ar
          export STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-strip
          
          make USE_STATIC_LIB=1 CC=$CC AR=$AR STRIP=$STRIP

      - name: Verify binary
        run: file i2c-tools-4.3/tools/i2cdetect

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i2c-tools-armv7a
          path: i2c-tools-4.3/tools/i2c*
